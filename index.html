<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Material</title>

  <!-- p5.js 2.x (pinned). To go fully offline, download this file to libraries/p5.min.js
         and point the src there instead. -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.min.js"></script>
  <!-- p5.dom is part of core p5 now; p5.sound was never used; p5.scribble is
         inlined in sketch.js (it relies on curveVertex, removed in p5 2.x). -->
  <script src="sketch.js?v=3"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: rgb(240, 240, 240);
    }

    body {
      overflow-x: hidden;
    }

    /* vertical scroll allowed: the phone layout is two screens tall */
    /* the sketch has no mouse/touch interaction, so let swipes pass through
         to the page: p5 2.x's own touch handlers otherwise block scrolling */
    canvas {
      display: block;
      pointer-events: none;
      touch-action: pan-y !important;
    }
  </style>
</head>

<body></body>

</html>
